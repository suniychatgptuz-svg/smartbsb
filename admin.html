<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>smartbsb admin</title>
<link rel="icon" href="logo-96.png">
<style>
:root{--bg:#0b0b1f;--card:#14142e;--line:#26264a;--txt:#ecebff;--mut:#9d9bc7;--a:#8b5cf6;--b:#ec4899;--pdf:#f43f5e;--xl:#22c55e;--bsb:#7c6cff;--chsb:#38bdf8;--dg:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#2e1f78 0,transparent 60%),radial-gradient(900px 500px at 110% 0,#5b1647 0,transparent 55%),var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.w{max-width:1150px;margin:0 auto;padding:24px 16px 60px}
h1{margin:0;font-size:26px;letter-spacing:-.5px}
h1 b{background:linear-gradient(90deg,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 14px;font-size:17px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.mut{color:var(--mut);font-size:13px}
button,input,select{font:inherit;color:var(--txt);background:#1c1c3c;border:1px solid var(--line);border-radius:10px;padding:9px 14px}
input,select{width:100%}
button{cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));border:0;font-weight:700;white-space:nowrap}
button.g{background:#1c1c3c;border:1px solid var(--line);font-weight:600}
button.g.on{border-color:var(--a);background:#2a2357}
button.sm{padding:6px 10px;font-size:13px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
label input,label select{margin-top:5px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.g4 .w2{grid-column:span 2}
@media(max-width:700px){.g4{grid-template-columns:1fr 1fr}}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px;border:2px dashed var(--line);border-radius:14px;cursor:pointer;text-align:center;color:var(--txt)}
.drop.ov,.drop:hover{border-color:var(--a);background:#1a1740}
.err{color:#fb7185;font-size:14px;margin-top:8px}
.hide{display:none!important}
.jh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ct{display:flex;flex-direction:column;gap:3px;background:#1c1c3c;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.ct select{padding:4px 8px;font-size:13px;width:auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pv th,.pv td{text-align:center;border:1px solid #2f2f55}
.pv td.nm{text-align:left}
.pv tr.gr5 td{background:#92D050;color:#10240a}.pv tr.gr4 td{background:#B7DEE8;color:#0b2a36}.pv tr.gr3 td{background:#FFFF00;color:#333300}.pv tr.gr2 td{background:#F4B084;color:#3d1a06}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;bottom:10px;border-color:var(--a)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kp .card{padding:16px;margin:0}
.kp .n{font-size:32px;font-weight:800;letter-spacing:-1px;margin-top:4px}
.kp .l{color:var(--mut);font-size:13px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
@media(max-width:800px){.row2{grid-template-columns:1fr}}
.bar{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar .nm{width:96px;font-weight:600}
.bar .tr{flex:1;height:22px;background:#1c1c3c;border-radius:6px;overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.bar .v{width:52px;text-align:right;font-weight:700}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mut)}
.lg span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.ch{display:flex;align-items:flex-end;gap:3px;height:180px;border-bottom:1px solid var(--line)}
.ch div{flex:1;min-width:3px;display:flex;flex-direction:column-reverse;position:relative;height:100%}
.ch div i{display:block;width:100%}
.ch div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#000;padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;z-index:2}
.ax{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;background:#24244a;font-size:12px;margin-right:4px}
.lock{max-width:420px;margin:12vh auto 0;text-align:center}
.lock #tgw{min-height:48px;margin:18px 0 6px}
.idbox{font:700 26px/1.2 ui-monospace,Consolas,monospace;letter-spacing:1px;background:#1c1c3c;border:1px solid var(--a);border-radius:10px;padding:10px;margin:10px 0;user-select:all}
.lock input{text-align:center;margin:14px 0 10px}
.lock button{width:100%}
a{color:#c4b5fd}
a.btnl{display:inline-block;text-decoration:none;color:var(--txt);background:#1c1c3c;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600}
button.dn{color:#fda4af}
code{font:600 14px ui-monospace,Consolas,monospace;letter-spacing:.5px}
code.big{font-size:16px;color:#fff}
.steps{text-align:left;margin:14px 0 0;padding-left:20px;line-height:1.7;color:var(--mut);font-size:14px}
.codein{font:700 22px ui-monospace,Consolas,monospace!important;letter-spacing:2px;text-transform:uppercase}
.ok{color:#4ade80;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="w">
  <div id="lock" class="card lock">
    <h1><b>smartbsb</b> admin</h1>
    <p class="mut">Faqat sayt egasi uchun. Netlify'dagi STATS_KEY parolini kiriting.</p>
    <input id="key" type="password" placeholder="Parol" autocomplete="current-password">
    <button id="go">Kirish</button>
    <div id="msg" class="err"></div>
  </div>
  <div id="app"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" integrity="sha512-dlPw+ytv/6JyepmelABrgeYgHI0O+frEwgfnPdXDTOIZz+eDgfW07QXG02/O8COfivBdGNINy+Vex+lYmJ5rxw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
const $=id=>document.getElementById(id);
const FN='/.netlify/functions/';
const K={get:()=>{try{return localStorage.getItem('skey')||''}catch(e){return''}},set:v=>{try{v?localStorage.setItem('skey',v):localStorage.removeItem('skey')}catch(e){}}};
function lock(msg){$('app').innerHTML='';$('lock').classList.remove('hide');$('msg').textContent=msg||''}
async function api(part,body){
  const o={headers:{'x-key':K.get()},cache:'no-store'};
  if(body){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch(FN+'admin-api?part='+part,o);
  if(r.status===401){K.set('');lock("Parol noto'g'ri");throw new Error('auth')}
  if(r.status===500){lock("Netlify'da STATS_KEY o'rnatilmagan");throw new Error('config')}
  return part==='app'?r.text():r.json();
}
async function start(){
  if(!K.get()){lock();return}
  $('msg').textContent='Yuklanmoqda...';
  let code;try{code=await api('app')}catch(e){if(e.message!=='auth'&&e.message!=='config')lock('Aloqa xatosi. Qayta urinib ko‘ring.');return}
  $('lock').classList.add('hide');
  window.ADMIN={root:$('app'),mode:'admin',api,logout:()=>{K.set('');lock('Chiqdingiz.')}};
  const s=document.createElement('script');s.textContent=code;document.body.appendChild(s);
}
$('go').onclick=()=>{K.set($('key').value.trim());$('key').value='';start()};
$('key').onkeydown=e=>{if(e.key==='Enter')$('go').onclick()};
start();
</script>
</body>
</html>
