<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>smartbsb admin</title>
<link rel="icon" href="logo-96.png">
<script>/* rejim: kabinet bilan umumiy (smartbsb_theme) */try{var t=localStorage.getItem('smartbsb_theme')||'auto',h=new Date().getHours(),d=t==='dark'||(t==='auto'&&(matchMedia('(prefers-color-scheme: dark)').matches||h>=19||h<7));if(d)document.documentElement.classList.add('dark')}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Kabinet (kabinet.html) bilan bir xil ranglar va uslub */
:root{--y:#fde047;--ind:#4f46e5;--night:#160a52;--ink:#16123a;--gray:#8a87a6;--mut:#5d5a78;--bg:#f5f4fd;--line:#e6e4f2;--card:#fff;--inp:#fff;--soft:#f3f2fb;
  --ok:#16a34a;--okb:#e8f7ee;--bad:#e11d48;--badb:#fff1f2;--warn:#d97706;--warnb:#fff7e0;--sh:0 14px 34px -22px rgba(34,16,110,.35);--side:236px;
  --txt:var(--ink);--a:var(--ind);--pdf:#f43f5e;--xl:#16a34a;--bsb:#6366f1;--chsb:#0ea5e9;--dg:#f59e0b}
html{color-scheme:light}
html.dark{color-scheme:dark;--bg:#0f0d22;--card:#18152f;--inp:#1f1b3d;--soft:#221e40;--line:#2b2750;--ink:#ecebff;--gray:#9d9abb;--mut:#bbb8d6;--ind:#8079ff;
  --okb:rgba(22,163,74,.18);--badb:rgba(225,29,72,.18);--warnb:rgba(217,119,6,.18);--xl:#4ade80;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;--sh:0 14px 34px -22px rgba(0,0,0,.8)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}
h1{font-size:22px;font-weight:800;letter-spacing:-.03em}
h2{margin:0 0 12px;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.mut{color:var(--gray);font-size:12.5px;font-weight:500}
.hide{display:none!important}
a{color:var(--ind);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
.lic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.lic svg{width:16px;height:16px;display:block}

/* tugma va maydonlar */
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;height:36px;background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:0 11px;font-weight:600;outline:0;transition:border-color .15s,box-shadow .15s}
textarea{height:auto;padding:10px 11px}
input[type=checkbox]{height:auto;accent-color:var(--ind)}
input:focus,select:focus,textarea:focus{border-color:var(--ind);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
button{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 15px;border:0;border-radius:10px;cursor:pointer;font-weight:700;white-space:nowrap;color:#fff;
  background:linear-gradient(180deg,#6366f1,#4338ca);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 16px -8px rgba(67,56,202,.7);transition:transform .12s,filter .15s,background .15s,border-color .15s}
button:hover{filter:brightness(1.07)}button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:default}
button.g{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600}
button.g:hover{background:var(--soft);filter:none;border-color:#cfcbe8}
html.dark button.g:hover{border-color:#3a3570}
button.g.on{border-color:var(--ind);color:var(--ind);background:var(--soft)}
button.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
button.dn{color:var(--bad)}button.g.dn:hover{background:var(--badb);border-color:transparent}
a.btnl{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label{display:block;font-size:12px;color:var(--gray);font-weight:700}
label input,label select{margin-top:5px;font-size:14px}

/* tuzilma: chap menyu + ish maydoni */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--night);color:#fff;display:flex;flex-direction:column;padding:18px 14px 14px;overflow:hidden auto;scrollbar-width:none;z-index:30}
.side:before,.side:after{content:"";position:absolute;border-radius:50%;filter:blur(34px);pointer-events:none}
.side:before{width:340px;height:340px;right:-190px;top:-150px;background:radial-gradient(circle,rgba(124,108,255,.85),transparent 68%)}
.side:after{width:300px;height:300px;left:-170px;bottom:-120px;background:radial-gradient(circle,rgba(79,70,229,.7),transparent 70%)}
.side>*{position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18.5px;letter-spacing:-.035em;padding:2px 6px 14px;color:#fff}
.logo img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.14),0 6px 16px -4px rgba(124,108,255,.8)}
.logo b{font-weight:900;color:var(--y)}
.logo small{display:block;font:500 9px 'JetBrains Mono',monospace;letter-spacing:.16em;color:rgba(255,255,255,.5);margin-top:1px}
.nlabel{font:500 9.5px 'JetBrains Mono',monospace;letter-spacing:.18em;color:rgba(255,255,255,.4);padding:12px 10px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.side .nv{justify-content:flex-start;gap:11px;width:100%;height:40px;padding:0 10px;border-radius:12px;font-weight:600;font-size:14px;color:rgba(255,255,255,.72);background:none;box-shadow:none;border:0}
.side .nv .lic svg{width:18px;height:18px}
.side .nv:hover{background:rgba(255,255,255,.07);color:#fff;filter:none}
.side .nv.on{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.09));color:#fff;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.side .nv.on .lic{color:var(--y)}
.sp{flex:1}
.main{min-width:0;padding:22px 26px 60px;max-width:1240px;width:100%}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hd select{width:auto}

/* kartalar */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.g4 .w2{grid-column:span 2}
@media(max-width:700px){.g4{grid-template-columns:1fr 1fr}}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px;border:2px dashed #cfcbe8;border-radius:14px;cursor:pointer;text-align:center;color:var(--ink);background:var(--soft);font-size:14px}
html.dark .drop{border-color:#3a3570}
.drop.ov,.drop:hover{border-color:var(--ind)}
.err{color:var(--bad);font-size:13px;margin-top:8px;font-weight:600}
.ok{color:var(--ok);font-size:13px;margin-top:8px;font-weight:600}
.jh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ct{display:flex;flex-direction:column;gap:3px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.ct select{height:28px;padding:0 8px;font-size:13px;width:auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th{color:var(--gray);font:500 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pv th,.pv td{text-align:center;border:1px solid var(--line)}
.pv td.nm{text-align:left}
.pv tr.gr5 td{background:#92D050;color:#10240a}.pv tr.gr4 td{background:#B7DEE8;color:#0b2a36}.pv tr.gr3 td{background:#FFFF00;color:#333300}.pv tr.gr2 td{background:#F4B084;color:#3d1a06}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;bottom:10px;border-color:var(--ind);flex-wrap:wrap}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kp .card{padding:15px 16px;margin:0}
.kp .n{font-size:28px;font-weight:800;letter-spacing:-.04em;margin-top:2px;line-height:1.15}
.kp .l{color:var(--gray);font:500 10px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
.row2{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
@media(max-width:800px){.row2{grid-template-columns:1fr}}
.bar{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar .nm{width:96px;font-weight:600}
.bar .tr{flex:1;height:20px;background:var(--soft);border-radius:6px;overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.bar .v{width:52px;text-align:right;font-weight:700}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--gray)}
.lg span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.ch{display:flex;align-items:flex-end;gap:3px;height:180px;border-bottom:1px solid var(--line)}
.ch div{flex:1;min-width:3px;display:flex;flex-direction:column-reverse;position:relative;height:100%}
.ch div i{display:block;width:100%}
.ch div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#16123a;color:#fff;padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;z-index:2}
.ax{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);margin-top:6px}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--soft);font-size:12px;margin-right:4px}
code{font:700 13px 'JetBrains Mono',ui-monospace,Consolas,monospace;letter-spacing:.04em}
code.big{font-size:14.5px}

/* Tokenlar bo'limi */
.srch{position:relative;flex:1;min-width:220px}
.srch .lic{position:absolute;left:11px;top:10px;color:var(--gray);pointer-events:none}
.srch input{padding-left:34px;height:38px}
.tl{display:flex;flex-direction:column}
.tr1{display:grid;grid-template-columns:minmax(0,1.5fr) 76px minmax(0,1.1fr) auto;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.tr1:first-child{border-top:0}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13.5px;background:linear-gradient(145deg,#7b6cff,#4338ca);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4)}
.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .mut{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:9px;font-weight:800;background:var(--warnb);color:var(--warn);justify-self:start}
.bal.z{background:var(--badb);color:var(--bad)}
.bal .lic svg{width:13px;height:13px;fill:currentColor}
.last{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qb{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.qb button.q{color:var(--ok);font-weight:800;min-width:46px}
.qb button.q:hover{background:var(--okb);border-color:transparent}
.sub1{grid-column:1/-1;background:var(--soft);border-radius:12px;padding:12px}
.sub1 .f{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.lg1{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
.lg1:first-child{border-top:0}
.pl{color:var(--ok);font-weight:800}.mi{color:var(--bad);font-weight:800}
details.card>summary{cursor:pointer;font-weight:800;font-size:15.5px;list-style:none;display:flex;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .lic{transition:transform .15s;color:var(--gray)}
details.card[open]>summary .lic{transform:rotate(90deg)}
details.card[open]>summary{margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:12px;background:#16123a;color:#fff;padding:10px 12px 10px 16px;border-radius:14px;box-shadow:0 18px 40px -14px rgba(0,0,0,.6);font-weight:600;max-width:calc(100vw - 24px)}
#toast button{height:28px;padding:0 10px;font-size:12.5px;background:rgba(255,255,255,.14);box-shadow:none;color:var(--y)}
@media(max-width:1180px){.tr1{grid-template-columns:minmax(0,1.5fr) 76px minmax(0,1.1fr)}.tr1 .qb{grid-column:1/-1;justify-content:flex-start;padding-left:44px}}
@media(max-width:900px){.tr1{grid-template-columns:minmax(0,1fr) auto}.tr1 .last{display:none}.tr1 .qb{padding-left:0}}

/* kirish oynasi */
.lockw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(900px 500px at 15% -10%,rgba(124,108,255,.28),transparent 60%),var(--bg)}
.lock{width:100%;max-width:380px;text-align:center;padding:26px 24px;margin:0}
.lock img{width:56px;height:56px;border-radius:50%;margin-bottom:10px;box-shadow:0 10px 24px -8px rgba(79,70,229,.7)}
.lock h1 b{color:var(--ind)}
.lock input{text-align:center;margin:16px 0 10px;height:42px}
.lock button{width:100%;height:42px}

/* telefon: menyu tepada gorizontal */
@media(max-width:820px){
  .app{display:block}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px 10px;gap:6px;overflow:auto hidden}
  .side:before,.side:after{display:none}
  .logo{padding:0 6px 0 0;font-size:0;gap:0}.logo img{width:32px;height:32px}.logo div{display:none}
  .nlabel,.sp{display:none}
  .nav{flex-direction:row;gap:4px}
  .side .nv{width:auto;height:36px;font-size:13px;padding:0 10px}
  .main{padding:16px 12px 60px}
  h1{font-size:19px}
}
</style>
</head>
<body>
<div id="lockw" class="lockw">
  <div id="lock" class="card lock">
    <img src="logo-96.png" alt="">
    <h1><b>smartbsb</b> admin</h1>
    <p class="mut" style="margin-top:6px">Faqat sayt egasi uchun. Admin parolini kiriting.</p>
    <input id="key" type="password" placeholder="Parol" autocomplete="current-password">
    <button id="go">Kirish</button>
    <div id="msg" class="err"></div>
  </div>
</div>
<div id="app"></div>
<script src="icons.js?v=2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" integrity="sha512-dlPw+ytv/6JyepmelABrgeYgHI0O+frEwgfnPdXDTOIZz+eDgfW07QXG02/O8COfivBdGNINy+Vex+lYmJ5rxw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
const $=id=>document.getElementById(id);
const FN='/.netlify/functions/';
const K={get:()=>{try{return localStorage.getItem('skey')||''}catch(e){return''}},set:v=>{try{v?localStorage.setItem('skey',v):localStorage.removeItem('skey')}catch(e){}}};
function lock(msg){$('app').innerHTML='';$('lockw').classList.remove('hide');$('msg').textContent=msg||''}
async function api(part,body){
  const o={headers:{'x-key':K.get()},cache:'no-store'};
  if(body){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch(FN+'admin-api?part='+part,o);
  if(r.status===401){K.set('');lock("Parol noto'g'ri");throw new Error('auth')}
  if(r.status===500){lock("Netlify'da STATS_KEY o'rnatilmagan");throw new Error('config')}
  return part==='app'?r.text():r.json();
}
async function start(){
  if(!K.get()){lock();return}
  $('msg').textContent='Yuklanmoqda...';
  let code;try{code=await api('app')}catch(e){if(e.message!=='auth'&&e.message!=='config')lock('Aloqa xatosi. Qayta urinib ko‘ring.');return}
  $('lockw').classList.add('hide');
  window.ADMIN={root:$('app'),mode:'admin',api,logout:()=>{K.set('');lock('Chiqdingiz.')}};
  const s=document.createElement('script');s.textContent=code;document.body.appendChild(s);
}
$('go').onclick=()=>{K.set($('key').value.trim());$('key').value='';start()};
$('key').onkeydown=e=>{if(e.key==='Enter')$('go').onclick()};
start();
</script>
</body>
</html>
